name: Smoke Tests

# only build on merges to main
on:
  push:
    branches:
    - main
  schedule:
    # Run every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to read-only permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: read

jobs:
  test:
    name: smoke-tests
    runs-on: ubuntu-latest
    env:
      PKGNET_SUPPRESS_BROWSER: 0
    strategy:
      fail-fast: false
      matrix: 
        test_pkg: 
          - askpass
          - assertthat
          - base64enc
          - bslib
          - cachem
          - cli
          - covr
          - cpp11
          - crayon
          - crosstalk
          - curl
          - data.table
          - digest
          - DT
          - evaluate
          - fastmap
          - fontawesome
          - formatR
          - fs
          - futile.options
          - glue
          - highr
          - htmltools
          - htmlwidgets
          - httpuv
          - httr
          - igraph
          - jquerylib
          - jsonlite
          - knitr
          - lambda.r
          - later
          - lazyeval
          - lifecycle
          - magrittr
          - memoise
          - mime
          - openssl
          - pkgconfig
          - promises
          - R6
          - rappdirs
          - Rcpp
          - rex
          - rlang
          - rmarkdown
          - sass
          - sys
          - tinytex
          - vctrs
          - visNetwork
          - withr
          - xfun
          - yaml
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: set up R
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: 'release'
      - name: If local, apt update
        if: ${{ (env.ACT || false) }}
        run: sudo apt update
      - name: Install Tidy
        run: sudo apt install -y tidy 
      - name: Install Deps For Pkgnet & ${{ matrix.test_pkg }}
        uses: r-lib/actions/setup-r-dependencies@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          extra-packages: ${{ matrix.test_pkg }}, local::.
      - name: run smoke test
        shell: Rscript {0}
        run: "pkgnet::CreatePackageReport(pkg_name='${{ matrix.test_pkg }}', report_path='${{ github.workspace }}/${{ matrix.test_pkg }}_report.html')"
  # https://github.community/t/is-it-possible-to-require-all-github-actions-tasks-to-pass-without-enumerating-them/117957/4?u=graingert
  all-successful:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      statuses: read
    steps:
      - name: Note that all tests succeeded
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
